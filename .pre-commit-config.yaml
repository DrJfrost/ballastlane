# Runs the fast checks before a commit exists, so the feedback loop is
# seconds rather than a CI round trip. CI re-runs everything anyway -- hooks
# can be skipped, so they are a convenience, never the guarantee.
#
#   pre-commit install
#   pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$   # tsconfig allows comments
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Catches a committed private key, which is the one mistake that
      # cannot be undone by a later commit.
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/src/
        args: [--config-file=backend/pyproject.toml]
        # mypy needs the real dependencies to check anything useful; without
        # these it reports hundreds of phantom "missing stubs" errors.
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - sqlalchemy[asyncio]>=2.0.36
          - fastapi>=0.115
          - types-redis

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|css)$

  - repo: local
    hooks:
      # The architecture test is cheap (milliseconds, no I/O) and guards the
      # property that is easiest to break by accident, so it runs on commit.
      - id: architecture
        name: dependency rule (Clean Architecture)
        entry: bash -c 'cd backend && python -m pytest tests/unit/test_architecture.py -q --no-cov'
        language: system
        pass_filenames: false
        files: ^backend/src/
