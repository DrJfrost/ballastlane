server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is already minified; gzip on top is the cheapest remaining
    # win on first load.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # Hashed filenames mean a built asset can never change under a given
    # name, so it is safe to cache it effectively forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is the file that points at the
    # hashed bundles, so a stale copy pins users to an old deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxying the API through the same origin removes CORS from the picture
    # entirely -- no preflight, no credentials/wildcard interaction.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Forwarded so the API rate-limits on the real client address rather
        # than on the proxy's.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: any unknown path is a client route, so it must fall
    # back to index.html. Without this, a refresh on /tasks returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
