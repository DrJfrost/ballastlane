# Alembic configuration.
#
# The database URL is intentionally absent: it is read from the application
# settings in migrations/env.py, so there is exactly one place that knows how
# to reach the database and no risk of the two disagreeing.

[alembic]
script_location = migrations
# Date-prefixed filenames so ``ls versions/`` shows the real order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
version_path_separator = os
path_separator = os

# No post-write hook: formatting of generated revisions is handled by the
# repo-wide pre-commit config, which works the same on every machine.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
